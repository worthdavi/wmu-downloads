# Where a map lets you out.
#
# One row per exit gate: the tile rectangle you step on, the map it lands you
# in, and the gate id the client asks the server to move it through. This is
# the same table the server moves players with (data/move/gate.xml there),
# reduced to flag="1" entries - the ones a player can walk into - and resolved
# through targetgate so the destination is a map number instead of a gate id.
#
# Regenerate with scripts/generategates.py; do not hand-edit.
#
# index      the gate id the teleport request carries
# map        the map id the server sends in the position packet
# x, y       one corner of the gate rectangle, in cells
# tx, ty     the opposite corner
# target     the map the gate leads to
# level      the character level the gate asks for

[[gate]]
index  = 1
map    = 0
x      = 121
y      = 232
tx     = 123
ty     = 233
target = 1
level  = 20

