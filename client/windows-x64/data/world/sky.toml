# Which map gets a sky, from which file, and drawn how.
#
# The dome is the SkyDome the legacy DLL added: a hemisphere pinned to the
# player, spherical UVs, turning slowly on its vertical axis, blended onto the
# frame before the terrain. Eight of the shipped worlds carry a Data/World*/
# Sky.bmp and those are the eight listed here as "dome". Icarus has no Sky.bmp;
# the original draws its cloud layer as a parallax backdrop, so it stays that
# way.
#
# number   the map id the server sends in the position packet
# name     for the reader only, never shown to a player
# texture  path inside the original install
# style    dome | parallax | none
#
# A texture named here that is not in the install is not an error: the client
# logs it once and the map keeps an empty horizon.
#
# The sky only reaches the screen once the camera is pitched down far enough to
# see past the terrain. At the default 48.5 degrees the whole frame is ground.

[dome]
# radius, then the theta/phi steps in degrees: the legacy generated the mesh
# with GenerateSkyDomeStructure(600, 5, 5, 1, 1).
radius          = 600.0
theta_step      = 5.0
phi_step        = 5.0
horizontal_tile = 1.0
vertical_tile   = 1.0

# glScalef(4, 4, 3) and a translate to the player minus 200 units of height.
scale_x       = 4.0
scale_y       = 4.0
scale_z       = 3.0
height_offset = -200.0

# glRotatef(WorldTime * 0.001) with WorldTime in milliseconds is one degree per
# second, so the sky comes back around every six minutes.
rotation_degrees_per_second = 1.0

# Multiplied into the texture before the additive blend. The legacy used white.
tint = [1.0, 1.0, 1.0, 1.0]

[[map]]
number  = 0
name    = "Lorencia"
texture = "Data/World1/Sky.bmp"
style   = "dome"

