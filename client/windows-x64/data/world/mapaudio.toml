# Which track plays on which map.
#
# This is the MapMusic column of the original MapManager.txt, which the legacy
# DLL read out of MainInfo.bmd and handed to PlayMp3 on every world load. Edit a
# row, restart, and the map sounds different; no recompilation.
#
# number    the map id the server sends in the position packet
# name      for the reader only, never shown to a player
# music     path inside the original install, played looped; empty means silence
# ambience  the looping room tone under the music, recovered from the jump table
#           at 0x0052747C in the original main.exe, which indexes maps 0 to 10
#           and lets everything above fall through to silence
#
# Noria's rare one-shot of aForest.wav over the wind now lives in
# data/audio/worldcues.toml, with the original's 1-in-512 roll.
#
# One row of that table stays unplayable here: Lorencia layers aRain.wav over the
# wind while the weather level at 0x07C74AE4 is above zero, and that level only
# rises when the server sends the weather packet the original handles at
# 0x00432B20 (high nibble of byte 3 = weather, low nibble = strength). The native
# protocol carries no weather message, so there is no counter to drive and the
# row is left out rather than faked. Devil Square needs none of that: the
# original plays aRain.wav there unconditionally and looped (0x004FDCF3), which
# is the ambience below.
#
# Two more details of the recovered table are not reproduced: Lorencia silences
# the wind and the rain while the hero stands on terrain type 4, and Devias
# silences the wind on types 3 and 10 and above - both are the original's way of
# muting weather under a roof.
#
# A track named here that is not in the install is not an error: the client logs
# it once and the map stays silent. Six of these ship with 0.97k.

[[map]]
number   = 0
name     = "Lorencia"
music    = "Data/Music/Lorencia.mp3"
ambience = "Data/Sound/aWind.wav"

