# Which NPC makes a sound of its own, and when.
#
# Recovered from the original main.exe. The per-object update switch at
# 0x004530AD indexes models 270..390 through the byte table at 0x00454A7C; only
# three NPC models reach a case that calls PlayBuffer. Every other NPC falls to
# case 28, the switch exit, and is silent in the original too.
#
# type      the creature number the server sends, as listed in
#           server data/monster/creatures/
# name      for the reader only, never shown to a player
# model     the original Data\Npc model whose switch case carries the cue
# sound     the slot the original loads the recording into. The original loads
#           nBlackSmith and nHarp into the same slot 120 and relies on only one
#           of the two models existing per map; this client keys the cue on the
#           file instead, so the collision cannot bite.
# file      the recording, inside the original install
# trigger   "animation" fires on the animation frame window below, the way the
#           original watches Object.AnimationFrame; "idle" fires on a timer
# from, to  animation trigger only: the keyframe window, from the original
# every     idle trigger only: mean seconds between cues. The original rolls
#           rand()%256 (harp) and rand()%64 (mix) once per rendered frame;
#           these are those odds expressed as seconds at 60 fps
#
# A recording named here that is not in the install is not an error: the client
# logs it once and that NPC stays silent.

[[npc]]
type    = 251
name    = "Hanzo the Blacksmith"
model   = "Npc/Smith"
sound   = 120
file    = "Data/Sound/nBlackSmith.wav"
trigger = "animation"
from    = 5.0
to      = 10.0

[[npc]]
type    = 242
name    = "Elf Lala"
model   = "Npc/ElfWizard"
sound   = 120
file    = "Data/Sound/nHarp.wav"
trigger = "idle"
every   = 4.3

[[npc]]
type    = 238
name    = "Chaos Goblin"
model   = "Npc/MixNpc"
sound   = 121
file    = "Data/Sound/nMix.wav"
trigger = "idle"
every   = 1.1
