# Which recording an item action plays.
#
# Every row here was read out of the original main.exe: the sound bank it fills
# at 0x0050F000 gives the number, and the call to PlayBuffer at the site that
# handles the action gives the pairing. Edit a row, restart, and the item path
# sounds different; no recompilation.
#
# action   the moment the client reached, listed below
# items    which global item IDs the row answers for; absent means every item,
#          including an action that carries no item at all
# sound    the number in the original sound bank, resolved to a file by
#          audio/playerfeedback.cpp
# name     for the reader only, never shown to a player
#
# Rows are tried top to bottom and the first match wins, so put the narrow
# selectors above the catch-all. A sound named here that is not in the install
# is not an error: the client logs it once and that action stays silent.
#
# drop           an item landed on the ground inside the viewport
# pickup         the server put an item, or the zen it sold for, in a container
# place          the server accepted moving an item between slots
# use            the server consumed a charge of a potion, apple or drink
# jewel          the server applied a jewel to the item under it
# repair         the server repaired the item, or every item
# mix            the chaos machine answered, whatever the answer was
# mix.success    ... and it made the item
# mix.failure    ... and it destroyed the ingredients

[[cue]]
action = "drop"
items  = "299"
sound  = 31
name   = "pDropMoney"

[[cue]]
action = "drop"
items  = "265,297,298,300,306"
sound  = 49
name   = "eGem"

[[cue]]
action = "drop"
items  = "1-8190"
sound  = 30
name   = "pDropItem"

[[cue]]
action = "pickup"
items  = "265,297,298,300,306"
sound  = 49
name   = "eGem"

[[cue]]
action = "pickup"
sound  = 29
name   = "pGetItem"

[[cue]]
action = "place"
sound  = 30
name   = "pDropItem"

[[cue]]
action = "use"
items  = "285"
sound  = 33
name   = "pEatApple"

[[cue]]
action = "use"
items  = "286-293"
sound  = 32
name   = "pDrink"

[[cue]]
action = "jewel"
sound  = 49
name   = "eGem"

[[cue]]
action = "repair"
sound  = 37
name   = "iRepair"

[[cue]]
action = "mix"
sound  = 67
name   = "eMix"

[[cue]]
action = "mix.success"
sound  = 49
name   = "eGem"

[[cue]]
action = "mix.failure"
sound  = 48
name   = "eBreak"
