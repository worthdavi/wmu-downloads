# Which recording a place or a thing in the world plays, and when.
#
# Every row was read out of the original main.exe: the sound bank filled at
# 0x0050F000 gives the number, the PlayBuffer call site gives the moment. Edit a
# row, restart, and the world sounds different; no recompilation.
#
# event    the moment the client reached, listed below
# map      the map id the server sends in the position packet; absent means
#          every map
# objects  which world object types the row answers for, as the .obj file stores
#          them; absent means the event carries no object
# sound    the recording, inside the original install
# odds     one-shot events only: the cue fires on a 1-in-odds roll per rendered
#          frame, the way the original rolls rand() % N; absent means every time
# gain     0..1, how loud; absent means 0.68
# name     for the reader only, never shown to a player
#
# Rows are tried top to bottom and the first match wins, so put the narrow
# selectors above the catch-all. A recording named here that is not in the
# install is not an error: the client logs it once and that event stays silent.
#
# door.open   a hinged or sliding door object started opening because the hero
#             walked up to it. The original drives this from the per-object
#             update at 0x004FDC00: Devias types 20, 65 and 88 swing and play
#             aDoor (PlayBuffer at 0x004FE3B2), type 86 is the castle gate and
#             slides, playing aCastleDoor (0x004FE30D). Both fire only while the
#             hero is inside the door's radius, which is what opens it.
# whisper     a private message arrived. The original plays this right after the
#             chat line of type 10 is appended (0x0042796E and 0x00439D2D) and
#             again on the friend path (0x0040CA11), each time gated by the
#             whisper-sound flag at 0x07E11D80 that its chat options window
#             flips; here that flag is audio.whisper in client.toml.
# forest      Noria's rare one-shot over the wind. The original rolls
#             rand() % 512 once per rendered frame inside the ambience jump
#             table at 0x0052747C (0x00526BE9).

[[cue]]
event   = "door.open"
map     = 2
objects = "86"
sound   = "Data/Sound/aCastleDoor.wav"
gain    = 0.85
name    = "aCastleDoor"

[[cue]]
event   = "door.open"
map     = 2
objects = "20,65,88"
sound   = "Data/Sound/aDoor.wav"
gain    = 0.75
name    = "aDoor"

[[cue]]
event = "whisper"
sound = "Data/Sound/iWhisper.wav"
gain  = 0.8
name  = "iWhisper"

[[cue]]
event = "forest"
map   = 3
odds  = 512
sound = "Data/Sound/aForest.wav"
gain  = 0.6
name  = "aForest"
