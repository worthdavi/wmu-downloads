# As placas acompanham a projeção dos personagens; controles usam o tema comum.
[screen]
components = "components.toml"
reference = [1280, 720]
scale = "fit"

[[widget]]
name = "background"
anchor = "center"
color = "ui_ink"
layer = 0

[[widget]]
name = "topshade"
anchor = "top-center"
size = [1280, 132]
color = "ui_overlay"
layer = 0

[[widget]]
name = "topfade"
anchor = "top-center"
offset = [0, 132]
size = [1280, 118]
color = "ui_overlay"
gradientcolor = "ui_transparent"
layer = 0

[[widget]]
name = "bottomshade"
anchor = "bottom-center"
size = [1280, 260]
color = "ui_transparent"
gradientcolor = "ui_overlay"
layer = 0

[[widget]]
name = "title"
component = "title"
anchor = "top-center"
offset = [0, 44]
size = [620, 46]
text = "Your characters"
textsize = 36
layer = 6

[[widget]]
name = "subtitle"
component = "body"
anchor = "top-center"
offset = [0, 94]
size = [540, 24]
text = "A new journey awaits amid the snows of Devias."
textcolor = "ui_muted"
layer = 6
textsize = 17

[[widget]]
name = "buttonback"
anchor = "top-left"
offset = [48, 48]
size = [114, 32]
text = "‹  Back"
textsize = 16
textcolor = "ui_muted"
texthovercolor = "ui_text"
action = "back"
layer = 6
color = "ui_transparent"
borderwidth = 0

[[widget]]
name = "roster_count"
component = "caption"
anchor = "top-right"
offset = [-48, 57]
size = [180, 24]
textanchor = "right"
text = "{character.count} characters"
textsize = 17
layer = 6

[[list]]
name = "slot"
source = "characters"
max = 5
centered = true
anchor = "center"
offset = [0, -5]
size = [160, 260]
step = [192, 0]
action = "select.character"
layer = 1

[[list]]
name = "nameplate"
source = "characters"
max = 5
centered = true
anchor = "bottom-center"
offset = [0, 58]
size = [160, 58]
step = [192, 0]
text = "{item}"
textanchor = "top-center"
textoffset = [0, 9]
textsize = 20
textcolor = "{item.namecolor}"
tag = "{item.note}"
taganchor = "bottom-center"
tagoffset = [0, -9]
tagsize = 13
tagcolor = "ui_muted"
action = "select.character"
layer = 6
active = "character.selected"
color = "ui_transparent"
borderwidth = 0

[[widget]]
name = "detailsurface"
anchor = "bottom-center"
offset = [-124, -40]
size = [652, 104]
layer = 2
spriteborderscale = 0.13
color = "ui_transparent"

[[widget]]
name = "detailcaption"
parent = "detailsurface"
anchor = "top-left"
offset = [44, 25]
size = [220, 16]
textanchor = "left"
text = "CHARACTER"
textsize = 12
textcolor = "ui_muted"
textshadow = false
layer = 6

[[widget]]
name = "name"
parent = "detailsurface"
anchor = "top-left"
offset = [44, 45]
size = [230, 32]
textanchor = "left"
text = "{character.name}"
textsize = 28
textcolor = "goldbright"
textshadow = false
layer = 6

[[widget]]
name = "classcaption"
parent = "detailsurface"
anchor = "top-left"
offset = [280, 25]
size = [180, 16]
textanchor = "left"
text = "CLASS"
textsize = 12
textcolor = "ui_muted"
textshadow = false
layer = 6

[[widget]]
name = "detail"
parent = "detailsurface"
anchor = "top-left"
offset = [280, 47]
size = [190, 28]
textanchor = "left"
text = "{character.class}"
textsize = 22
textcolor = "ui_text"
textshadow = false
layer = 6

[[widget]]
name = "levelcaption"
parent = "detailsurface"
anchor = "top-left"
offset = [532, 25]
size = [76, 16]
textanchor = "left"
text = "LEVEL"
textsize = 12
textcolor = "ui_muted"
textshadow = false
layer = 6

[[widget]]
name = "level"
parent = "detailsurface"
anchor = "top-left"
offset = [532, 44]
size = [76, 32]
textanchor = "left"
text = "{character.level}"
textsize = 28
textcolor = "ui_accent"
textshadow = false
layer = 6

[[widget]]
name = "buttonenter"
anchor = "bottom-center"
offset = [336, -70]
size = [220, 40]
text = "{character.enterlabel}"
texthovercolor = "goldbright"
action = "character.enter"
layer = 6
textsize = 18
color = "ui_transparent"
borderwidth = 0

[[widget]]
name = "status"
anchor = "top-center"
offset = [0, 128]
size = [540, 48]
text = "{character.status}"
textsize = 15
textcolor = "{character.statuscolor}"
textshadow = false
layer = 6
component = "notice"
visiblewhen = "{character.status}"
textanchor = "center"
textoffset = [0, 0]

[[widget]]
name = "keyboardhint"
anchor = "bottom-center"
offset = [0, -11]
size = [760, 22]
text = ""
textsize = 15
textcolor = "ui_muted"
textshadow = false
layer = 6

[[widget]]
name = "dragoncrest"
component = "crest"
anchor = "top-center"
offset = [0, 6]
size = [190, 38]
layer = 5
