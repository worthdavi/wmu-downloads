# Cores com nome. Nenhum layout escreve um RGB: trocar a paleta
# inteira do cliente e mexer aqui e salvar, com o jogo aberto.

[color]
access_panel = "#151a23d6"
access_panel_bottom = "#111720e6"
access_border = "#b9bec359"
access_row = "#0c101ba8"
access_row_hover = "#665334b8"
access_row_border = "#aab0b64d"
access_art = "#bcc5d1ff"
access_field = "#090e17c4"
access_field_focus = "#202630eb"
access_gold = "#614d2dea"
access_gold_hover = "#806439fa"
access_gold_bottom = "#32291fe8"
access_rule = "#d3bb822e"
access_veil = "#080e162c"
ui_ingame_panel = "#0b0e14e8"
ui_gameveil = "#080b1250"
ui_mana = "#7bbdfaff"
ui_notice = "#131722f5"
ui_notice_border = "#80664bff"
ui_art_dim = "#9eabbcff"
white      = "#ffffffff"
gold       = "#f0c86eff"
goldbright = "#ffe6a8ff"
text       = "#e8ddc4ff"
dim        = "#9d8f74ff"
danger     = "#e06a4aff"

# Escada de lotacao. O dourado da casa e "movimentado", nao "atencao", entao os
# dois degraus de baixo tem cor propria: aco frio e jade dessaturado.
crowdempty = "#7a8794ff"
crowdfree  = "#6fae8cff"

# Painel do formulario: preto quase opaco por cima da arte de fundo.
panel      = "#0a0806e0"
# Veu do formulario: a arte de fundo e a protagonista, entao o painel deixa a
# ilustracao aparecer em vez de virar uma placa preta por cima dela.
panelveil  = "#0a0806a8"
fieldrule  = "#f0c86e55"
fieldruleon = "#f0c86ecc"
panelline  = "#f0c86e40"
field      = "#00000099"
fieldfocus = "#2a1f10cc"
shade      = "#00000066"

# Palco da selecao de personagem: o slot escolhido ganha um banho dourado, o
# resto fica so um degrau acima do fundo.
slotidle   = "#0000004d"
slotactive = "#f0c86e26"

# Selecao: marfim para leitura, ouro para selecao e acao principal.
transparent = "#080c1200"
selectshade = "#080c12f5"
selectpanel = "#10151bf7"
selectplate = "#10151bee"
selectplateactive = "#25231cf5"
selectplatehover = "#303027fa"
selectline = "#82705199"
selecttext = "#f5f1e8ff"
selectmuted = "#c3c7cdff"
selectgold = "#e4c17aff"
selectgoldhover = "#f5dca3ff"
selectink = "#171b21ff"

# Componentes compartilhados das telas de acesso.
ui_text = "#f5f1e8ff"
ui_muted = "#b8c1ccff"
ui_accent = "#e4c17aff"
ui_accent_hover = "#f2d79eff"
ui_ink = "#151b23ff"
ui_surface = "#152135f5"
ui_surface_hover = "#263442ff"
ui_border = "#627083ff"
ui_overlay = "#080e16c4"
ui_transparent = "#080e1600"
ui_danger = "#ffaba3ff"
ui_success = "#91d9b6ff"
ui_field = "#0b121bff"
ui_field_focus = "#16232fff"
ui_danger_surface = "#382125ff"
ui_success_surface = "#192e29ff"

# Invasion pings on the Tab map: ember against the terrain's grey-green, so a
# live invasion never reads as one more NPC dot.
map_invasion = "#ff9a4bff"
map_invasion_deep = "#d2401eff"
map_invasion_ring = "#ffb070ff"
map_invasion_halo = "#ff7a3c99"
map_invasion_shadow = "#2a0b06cc"

ui_art_idle = "#c7d6eaff"
ui_art_hover = "#ffffffff"
ui_panel_bottom = "#070c16f5"
ui_steel = "#24344bff"
ui_ornament_border = "#8e774fff"

# Tela de titulo: moldura simples, sem filigrana. Duas linhas de metal, quatro
# cantoneiras e um losango - o resto da fantasia vem da cena atras do painel.
title_panel = "#0a0f16e8"
title_panel_bottom = "#070b11f4"
title_edge = "#8d7448ff"
title_inlay = "#e4c17a3d"
title_corner = "#f0d79aff"
title_rule = "#e4c17a59"
title_plate = "#0d131bb8"
title_plate_active = "#2b2417e0"
title_plate_edge = "#7d6a4699"
title_plate_edge_active = "#e4c17acc"
title_plate_lip = "#ffffff14"
# Veu de cima e de baixo: a cena continua viva, o texto continua legivel, e a
# linha do horizonte para de competir com o menu.
title_scrim = "#05080ce6"
title_scrim_soft = "#05080c00"

# Faces por papel de texto. "display" e a Cinzel de data/ui/display.ttf;
# "body" e a Source Sans de data/ui/font.ttf, que continua sendo o corpo.
[face]
title = "display"
body = "body"
detail = "body"
button = "body"

[size]
# Padrao das janelas do mundo. Inventario, atributos, skills, social e mover
# ocupam esta largura: 280 x 610 unidades da tela de referencia, coladas na
# borda direita com "panelmargin" de folga, e nunca maiores que "panelscale".
# Cada janela tem a sua propria grade interna; o que este bloco fixa e a
# largura em pixels, para que trocar de janela nao mexa nada na tela.
panelwidth = 280
panelheight = 610
panelmargin = 20
panelscale = 1.20

# Caixa de descricao de item. A original centraliza cada linha; a margem
# lateral vale dos dois lados, entao a largura minima ja conta com ela.
tooltippadding = 14
tooltipminwidth = 196

selectcamerascale = 1.12
selectcameraheight = -20
mapinvasionsize = 10
mapinvasionring = 15
mapinvasionspread = 20
mapinvasionpulse = 2.2

# Tipografia do mapa do Tab. O corpo minimo e 15: abaixo disso o nome que
# aparece sob o cursor some no terreno, ainda que a barra de opacidade esteja
# no maximo.
maptitlesize = 22
maplabelsize = 18
mapcoordinatesize = 16
mapfootersize = 15
maplegendsize = 15
mapglyphsize = 18
mapcompasssize = 15
mapfooterheight = 26
mapbuttonsize = 26
mapzoomlabelwidth = 62
mapfadelabelwidth = 100
# Piso de opacidade so das letras. A barra do rodape continua mandando na
# placa, nos marcadores e nos paineis; o texto nunca desce daqui, senao a
# unica forma de ler o mapa seria deixar tudo opaco.
maplabelopacity = 0.9

# Geometria da moldura de titulo, em unidades da tela de referencia.
titleframeradius = 3
titleframeinset = 7
titlecorner = 30
titlecornerweight = 2
titlerule = 1
# Molduras mais estreitas que isto ficam sem o losango central: cinco cartoes
# de personagem lado a lado viram filigrana.
titlepipwidth = 260
# Fracao da altura da tela coberta pelo veu de cima e pelo de baixo.
titlescrimtop = 0.46
titlescrimbottom = 0.24
