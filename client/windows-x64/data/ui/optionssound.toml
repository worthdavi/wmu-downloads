[screen]
components = "components.toml"
reference = [1280, 720]
scale = "none"

[[widget]]
name = "background"
anchor = "center"
sprite = "ui/loginbackground.png"
fit = "cover"
layer = 0
visible = false

[[widget]]
name = "veil"
anchor = "center"
color = "ui_overlay"
layer = 1

[[widget]]
name = "panel"
anchor = "center"
size = [420, 296]
color = "ui_transparent"
layer = 2

[[widget]]
name = "title"
component = "title"
parent = "panel"
anchor = "top-left"
offset = [30, 35]
size = [360, 32]
text = "{options.soundlabel}"
textanchor = "center"
textsize = 26
textface = "display"
layer = 6

[[widget]]
name = "volume"
parent = "panel"
anchor = "top-left"
offset = [30, 74]
size = [360, 32]
color = "ui_transparent"
text = "{options.volumelabel}"
textcolor = "ui_text"
textanchor = "left"
textoffset = [36, 0]
textsize = 17
tag = "{options.volume}  ›"
taganchor = "right"
tagoffset = [-36, 0]
tagsize = 15
tagcolor = "ui_muted"
action = "options.volume"
layer = 6
[[widget]]
name = "soundvolume"
parent = "panel"
anchor = "top-left"
offset = [30, 110]
size = [360, 32]
color = "ui_transparent"
text = "{options.soundvolumelabel}"
textcolor = "ui_text"
textanchor = "left"
textoffset = [36, 0]
textsize = 17
tag = "{options.soundvolume}  ›"
taganchor = "right"
tagoffset = [-36, 0]
tagsize = 15
tagcolor = "ui_muted"
action = "options.soundvolume"
layer = 6
[[widget]]
name = "musicvolume"
parent = "panel"
anchor = "top-left"
offset = [30, 146]
size = [360, 32]
color = "ui_transparent"
text = "{options.musicvolumelabel}"
textcolor = "ui_text"
textanchor = "left"
textoffset = [36, 0]
textsize = 17
tag = "{options.musicvolume}  ›"
taganchor = "right"
tagoffset = [-36, 0]
tagsize = 15
tagcolor = "ui_muted"
action = "options.musicvolume"
layer = 6
[[widget]]
name = "music"
parent = "panel"
anchor = "top-left"
offset = [30, 182]
size = [360, 32]
color = "ui_transparent"
text = "{options.musiclabel}"
textcolor = "ui_text"
textanchor = "left"
textoffset = [36, 0]
textsize = 17
tag = "{options.music}  ›"
taganchor = "right"
tagoffset = [-36, 0]
tagsize = 15
tagcolor = "ui_muted"
action = "options.music"
layer = 6
[[widget]]
name = "status"
component = "caption"
parent = "panel"
anchor = "top-left"
offset = [30, 218]
size = [360, 20]
text = "{options.status}"
textcolor = "{options.statuscolor}"
textsize = 14
textwrap = true
layer = 6
[[widget]]
name = "back"
parent = "panel"
anchor = "top-left"
offset = [30, 244]
size = [360, 32]
color = "ui_transparent"
text = "{options.soundbacklabel}"
textcolor = "ui_text"
textanchor = "center"
textoffset = [0, 0]
textsize = 19
action = "back"
layer = 6
