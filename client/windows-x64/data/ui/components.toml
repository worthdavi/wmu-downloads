# Estilos compartilhados. A declaração de cada widget pode sobrepor propriedades.
[component.accesspanel]
color = "access_panel"
gradientcolor = "access_panel_bottom"
bordercolor = "access_border"
borderwidth = 1
radius = 8

[component.worldrow]
color = "access_art"
hovercolor = "white"
bordercolor = "access_row_border"
borderwidth = 1
radius = 3
textsize = 18
textcolor = "ui_text"
texthovercolor = "goldbright"
textshadow = true

[component.channelrow]
color = "access_row"
hovercolor = "access_row_hover"
bordercolor = "access_row_border"
borderwidth = 1
radius = 4
textsize = 18
textcolor = "ui_text"
texthovercolor = "goldbright"
textshadow = false

[component.accessprimary]
color = "access_gold"
gradientcolor = "access_gold_bottom"
hovercolor = "access_gold_hover"
bordercolor = "ui_ornament_border"
borderwidth = 1
radius = 4
textsize = 18
textcolor = "goldbright"
textshadow = false

[component.card]
sprite = "ui/dragonframe.png@1024"
spriteborder = [310, 260, 310, 260]
spriteborderscale = 0.14
color = "white"

[component.primary]
sprite = "ui/dragonbutton.png@1024"
spriterect = [0, 166, 2172, 368]
color = "ui_art_idle"
hovercolor = "ui_art_hover"
textsize = 20
textcolor = "ui_accent"
texthovercolor = "goldbright"
textshadow = true

[component.secondary]
color = "ui_steel"
gradientcolor = "ui_panel_bottom"
hovercolor = "ui_surface_hover"
radius = 5
bordercolor = "ui_border"
borderwidth = 1
textsize = 20
textcolor = "ui_text"
texthovercolor = "ui_accent"
textshadow = false

[component.ghost]
color = "ui_transparent"
hovercolor = "ui_surface_hover"
radius = 10
textsize = 18
textcolor = "ui_muted"
texthovercolor = "ui_text"
textshadow = false

[component.field]
color = "ui_field"
radius = 5
bordercolor = "ui_border"
borderwidth = 1
textanchor = "left"
textoffset = [16, 0]
textsize = 20
textcolor = "ui_text"
textshadow = false

[component.title]
textsize = 34
textcolor = "ui_text"
textshadow = false

[component.caption]
textsize = 16
textcolor = "ui_muted"
textshadow = false

[component.body]
textsize = 18
textcolor = "ui_text"
textshadow = false

[component.crest]
sprite = "ui/dragoncrest.png@1024"
spriterect = [0, 150, 2172, 420]

[component.nameplate]
sprite = "ui/dragonframe.png@1024"
spriteborder = [310, 260, 310, 260]
spriteborderscale = 0.055
color = "ui_art_idle"
hovercolor = "white"
textcolor = "ui_text"
texthovercolor = "goldbright"
textshadow = true

[component.notice]
color = "ui_notice"
bordercolor = "ui_notice_border"
borderwidth = 1
radius = 4
textsize = 14
textanchor = "left"
textoffset = [12, 0]
textwrap = true
textshadow = false
