[screen]
components = "components.toml"
reference = [1280, 720]
scale = "none"

[[widget]]
name = "veil"
anchor = "center"
color = "ui_gameveil"
layer = 1

[[widget]]
name = "panel"
anchor = "center"
size = [300, 332]
color = "ui_transparent"
layer = 2

[[widget]]
name = "title"
component = "title"
parent = "panel"
anchor = "top-left"
offset = [30, 35]
size = [240, 32]
text = "{options.menulabel}"
textanchor = "center"
textsize = 28
layer = 6

[[widget]]
name = "quit"
parent = "panel"
anchor = "top-left"
offset = [30, 84]
size = [240, 36]
color = "ui_transparent"
text = "{options.quitlabel}"
textcolor = "ui_danger"
textanchor = "center"
textoffset = [0, 0]
textsize = 20
action = "quit"
layer = 6

[[widget]]
name = "characters"
parent = "panel"
anchor = "top-left"
offset = [30, 128]
size = [240, 36]
color = "ui_transparent"
text = "{options.characterslabel}"
textcolor = "ui_text"
textanchor = "center"
textoffset = [0, 0]
textsize = 20
action = "options.characters"
layer = 6

[[widget]]
name = "servers"
parent = "panel"
anchor = "top-left"
offset = [30, 172]
size = [240, 36]
color = "ui_transparent"
text = "{options.serverslabel}"
textcolor = "ui_text"
textanchor = "center"
textoffset = [0, 0]
textsize = 20
action = "options.servers"
layer = 6

[[widget]]
name = "open"
parent = "panel"
anchor = "top-left"
offset = [30, 216]
size = [240, 36]
color = "ui_transparent"
text = "{options.openlabel}"
textcolor = "ui_text"
textanchor = "center"
textoffset = [0, 0]
textsize = 20
action = "options.open"
layer = 6
[[widget]]
name = "back"
parent = "panel"
anchor = "top-left"
offset = [30, 260]
size = [240, 36]
color = "ui_transparent"
text = "{options.cancellabel}"
textcolor = "ui_text"
textanchor = "center"
textoffset = [0, 0]
textsize = 20
action = "back"
layer = 6
