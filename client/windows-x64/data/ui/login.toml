[screen]
components = "components.toml"
reference = [1280, 720]
scale = "none"

[[widget]]
name = "background"
anchor = "center"
sprite = "ui/loginbackground.png"
fit = "cover"
layer = 0
visible = false

[[widget]]
name = "wordmark"
anchor = "center"
offset = [0, -224]
size = [420, 142]
sprite = "ui/wmu-logo.png"
fit = "contain"
layer = 6

[[widget]]
name = "frame"
anchor = "center"
offset = [0, 82]
size = [364, 372]
layer = 2
color = "ui_transparent"

[[widget]]
name = "servername"
component = "caption"
parent = "frame"
anchor = "top-left"
offset = [34, 28]
size = [296, 18]
textanchor = "left"
textsize = 16
text = "{login.server}"
textcolor = "ui_accent"
layer = 6

[[widget]]
name = "title"
component = "title"
parent = "frame"
anchor = "top-left"
offset = [34, 46]
size = [296, 32]
textanchor = "left"
textsize = 28
textface = "display"
text = "{login.title}"
layer = 6

[[widget]]
name = "titleline"
parent = "frame"
anchor = "top-left"
offset = [34, 86]
size = [296, 1]
color = "title_rule"
layer = 6

[[widget]]
name = "labeluser"
component = "caption"
parent = "frame"
anchor = "top-left"
offset = [34, 100]
size = [296, 18]
textanchor = "left"
text = "{login.userlabel}"
layer = 6
textsize = 16
textcolor = "ui_accent"

[[widget]]
name = "fielduser"
parent = "frame"
anchor = "top-left"
offset = [34, 120]
size = [296, 32]
textsize = 20
textoffset = [30, 0]
text = "{login.user}"
action = "focus.user"
layer = 6
color = "ui_transparent"
borderwidth = 0
textanchor = "left"

[[widget]]
name = "labelpass"
component = "caption"
parent = "frame"
anchor = "top-left"
offset = [34, 160]
size = [296, 18]
textanchor = "left"
text = "{login.passlabel}"
layer = 6
textsize = 16
textcolor = "ui_accent"

[[widget]]
name = "fieldpass"
parent = "frame"
anchor = "top-left"
offset = [34, 180]
size = [296, 32]
textsize = 20
textoffset = [30, 0]
text = "{login.pass}"
action = "focus.pass"
layer = 6
color = "ui_transparent"
borderwidth = 0
textanchor = "left"

[[widget]]
name = "rememberlogin"
parent = "frame"
anchor = "top-left"
offset = [34, 220]
size = [296, 26]
text = "{login.rememberlabel}"
action = "login.remember"
textanchor = "left"
textoffset = [32, 0]
textsize = 17
textcolor = "{login.remembercolor}"
color = "ui_transparent"
borderwidth = 0
layer = 6

[[widget]]
name = "status"
component = "caption"
parent = "frame"
anchor = "top-left"
offset = [34, 250]
size = [296, 30]
textsize = 15
textanchor = "left"
text = "{login.status}"
textcolor = "{login.statuscolor}"
layer = 6
visiblewhen = "{login.status}"
textoffset = [0, 0]
textwrap = true

[[widget]]
name = "buttonlogin"
parent = "frame"
anchor = "top-left"
offset = [34, 286]
size = [296, 36]
text = "{login.submitlabel}"
action = "login.submit"
layer = 6
textsize = 20
color = "ui_transparent"
borderwidth = 0

[[widget]]
name = "buttonback"
parent = "frame"
anchor = "top-left"
offset = [34, 330]
size = [296, 28]
text = "{login.backlabel}"
action = "back"
layer = 6
textsize = 16
color = "ui_transparent"
borderwidth = 0

[[widget]]
name = "keyboardhint"
component = "caption"
anchor = "bottom-center"
offset = [0, -24]
size = [440, 20]
text = ""
layer = 6
