[screen]
components = "components.toml"
reference = [1280, 720]
scale = "none"

[[widget]]
name = "background"
anchor = "center"
sprite = "ui/loginbackground.png"
fit = "cover"
layer = 0
visible = false

[[widget]]
name = "veil"
anchor = "center"
color = "ui_overlay"
layer = 1

[[widget]]
name = "panel"
anchor = "center"
size = [420, 478]
color = "ui_transparent"
layer = 2

[[widget]]
name = "title"
component = "title"
parent = "panel"
anchor = "top-left"
offset = [30, 35]
size = [360, 32]
text = "{options.titlelabel}"
textanchor = "center"
textsize = 26
textface = "display"
layer = 6

[[widget]]
name = "fullscreen"
parent = "panel"
anchor = "top-left"
offset = [30, 74]
size = [360, 32]
color = "ui_transparent"
text = "{options.fullscreenlabel}"
textcolor = "ui_text"
textanchor = "left"
textoffset = [36, 0]
textsize = 17
tag = "{options.fullscreen}  ›"
taganchor = "right"
tagoffset = [-36, 0]
tagsize = 15
tagcolor = "ui_muted"
action = "options.fullscreen"
layer = 6
