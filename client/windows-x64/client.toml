# Configuracao do cliente. Tudo aqui vale sem recompilar nada: edite, salve e
# abra o jogo. Argumento de linha de comando sobrepoe qualquer valor deste
# arquivo por uma sessao (wmu --help lista as opcoes).

[window]
width      = 1920
height     = 1080
fullscreen = false
vsync      = true
resizable  = true
title      = "wmu"
clear      = [0.06, 0.07, 0.09]

[loop]
# Passo fixo da simulacao. 60 Hz e o que casa com o tick do servidor; mexer
# aqui muda quantas vezes por segundo o mundo avanca, nao quantos quadros
# aparecem na tela.
simulationhz = 60
# Teto de quadros por segundo. 0 e sem teto.
maxfps = 0

[paths]
# Instalacao original do MU 0.97k: a pasta que tem Data/ e main.exe. Nada e
# escrito la dentro.
#
# Caminho relativo e procurado a partir do diretorio de trabalho e, subindo, a
# partir do executavel - entao "game" acha game/ deste repositorio mesmo quando
# o .app e aberto pelo Finder. Se a sua instalacao mora em outro lugar, ponha o
# caminho absoluto aqui:
#     game = "/Users/voce/MuOnline"
game   = "game"
data   = "data"
keymap = "keys.toml"

[server]
host = "127.0.0.1"
port = 55901
reconnect_seconds = 90
# Certificado publico PEM; caminho relativo a este arquivo. Vazio usa a CA
# distribuida em data/network/ca.pem, quando presente, ou as CAs do sistema.
tls_ca_file = ""

[text]
# Idioma da interface: o codigo de um arquivo em data/text/. "en" e a tabela
# compilada no cliente; qualquer outro codigo carrega data/text/<codigo>.toml
# por cima dela, linha a linha, e uma linha ausente continua em ingles. O
# codigo tambem escolhe Data/Local/Dialog_*.bmd e o idioma anunciado ao
# servidor. Disponiveis: en | pt-br
language = "en"

[map]
# Estado do mapa de tela cheia (TAB), lembrado entre sessoes como o cliente
# original lembrava em Config.ini. zoom vai de 0 (mapa inteiro) a 6 (janela de
# 64 celulas em volta do personagem); opacity vai de 0.3 a 1.0.
zoom    = 0
opacity = 1.0

[camera]
# distance e o raio da orbita em unidades de mundo. 1000 e o valor que o
# MoveCamera do main.exe escreve todo quadro (0x00524D3C, 0x447A0000); o
# cliente vinha usando 1400, um recuo de 40% que nao estava escrito em lugar
# nenhum. Com a roda do mouse ligada ao mundo, quem prefere o enquadramento
# afastado gira a roda ou escreve 1400 aqui.
distance = 1000.0
# Plano distante. O original usa 2800 (2000 * 1.4), dimensionado para os
# 640x480 dele; aqui o mundo e desenhado ate 6000 e reduzir isso corta terreno
# visivel. O plano cresce sozinho conforme a camera se afasta.
far = 6000.0

# control = false devolve a camera fixa: roda, arrasto do meio e F11 param.
control = true

# Zoom em porcento da distancia padrao: a camera fica a distance * 100/zoom.
# min_zoom afasta (50 = 2000 unidades), max_zoom aproxima. O Camera.cpp legado
# usava 50-300 escalando a FOV; aqui escala a distancia, que nao distorce o
# boneco, e 300 (333 unidades) colava a camera no personagem: ele cobria 80%
# da altura da tela.
#
# 170 e medido, nao chutado: com fov vertical de 35 graus e pitch de 48.5, o
# personagem ocupa metade da altura da tela a 588 unidades, e 1000/588 = 1.70.
# Como a FOV vertical e fixa, essa metade e a mesma em 4:3, 16:9 e 21:9 - a
# largura muda, a altura nao. O teto duro do cliente continua 300, entao quem
# quiser chegar mais perto escreve max_zoom = 300 aqui.
#
# O numero acompanha distance: o piso e a distancia de 588 unidades, ou seja
# max_zoom = 100 * distance / 588. Com distance = 1400, seriam 238.
#
# zoom_step mantem a contagem de passos do legado: 2 graus de 35 por entalhe,
# o que da 21 entalhes entre 50 e 170.
min_zoom  = 50.0
max_zoom  = 170.0
zoom_step = 5.714

# Arrasto com o botao do meio. O legado girava 6 graus em X e 2.42 em Y por
# evento de mouse; aqui e por pixel, na mesma proporcao e um decimo do ritmo.
yaw_per_pixel   = 0.6
pitch_per_pixel = 0.242

# Limites da inclinacao. 22.5 e o piso do legado; 48.5 (o padrao do jogo) so
# mostra chao, e e perto de 22.5 que o ceu aparece. 89 evita o olhar a pino.
min_pitch = 22.5
max_pitch = 89.0

[log]
# debug | info | warn | error
level = "info"

[audio]
# Volume de 0.0 a 1.0. Efeito e musica sao separados porque o cliente original
# tambem separa: Config.ini tem SoundLevel e MusicLevel em escalas proprias.
# enabled = false nem abre o dispositivo - o jogo roda mudo, sem erro.
enabled = true
master  = 1.0
effects = 1.0
music   = 0.6
# whisper = false cala o aviso de sussurro. O original tinha o mesmo interruptor,
# a flag em 0x07E11D80 que a janela de opcoes de chat invertia.
whisper = true

[screenshot]
# Print Screen guarda o quadro. O original do MU chamava SaveScreen em
# 0x00511140, lia o framebuffer em GL_RGB e gravava um JPEG de qualidade 100
# com o nome Screen(MM_DD-HH_MM)-NNNN.jpg na pasta do jogo; o nome continua o
# mesmo, o formato virou PNG sem perda porque o cliente novo nao carrega um
# codificador JPEG.
#
# directory vazio usa a pasta de imagens do sistema (~/Pictures/wmu no macOS).
# Caminho relativo conta a partir do diretorio de trabalho.
directory = ""
# png | tga. tga e o formato cru que os testes de captura ja usam.
format    = "png"
