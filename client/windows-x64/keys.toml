# Key to action map. On the left the key, on the right the action the game
# understands. Remapping is editing this file: no key name exists in C++.
#
# Key names are SDL's, lowercase, with an underscore in place of a space
# ("left_shift", "page_up"). Modifiers come in front with "+" ("ctrl+q").
# Mouse buttons are "mouse1" (left), "mouse2" (right), "mouse3" (middle).
# A list gives one key more than one action, and the same action may appear
# on several keys.
#
# Action names are the ones the code asks for, and only those: an action
# spelled any other way is silently dead, so the keymap test rejects a name
# that is not on the list below. Every action the game reads is listed here,
# whether or not you rebind it.
#
#   app.quit           leave the game
#   app.fullscreen     toggle fullscreen
#   app.screenshot     save a screenshot to the screenshot folder
#
#   ui.pointer         click: move, pick, press buttons
#   ui.secondary       right click: attack, cast, context menu
#   ui.erase           delete the character behind the cursor in a text field
#   ui.orbit           hold and drag to orbit the camera
#
#   game.item.0 .. 3   use the item in hotbar slot 1 to 4
#   game.skill.0 .. 4  select the skill in skill slot 1 to 5
#   game.inventory     open or close the inventory
#   game.character     open or close the character sheet
#   game.social        open or close friends and party
#   game.skills        open or close the skill book
#   game.guild         open or close the guild tab
#   game.chat          put the cursor in the chat line
#   game.move          open or close the move (warp) list
#   game.pickup        pick up the item under the character
#   game.map.toggle    show or hide the world map
#   game.camera.reset  put the camera back where it started
#   game.events        show or hide the event timer
#   game.run           hold to click-to-walk on the open world map
#
# Escape is reserved for back/options and never quits the application, so it
# cannot be bound here.

[keys]
"ctrl+q" = "app.quit"
"alt+return" = "app.fullscreen"
# Print Screen is the original's key (VK_SNAPSHOT, read at 0x005262AA of
# main.exe). Mac keyboards have no such key, so f12 works alongside it.
print_screen = "app.screenshot"
f12 = "app.screenshot"

mouse1 = "ui.pointer"
mouse2 = "ui.secondary"
mouse3 = "ui.orbit"
backspace = "ui.erase"

q = "game.item.0"
w = "game.item.1"
e = "game.item.2"
r = "game.item.3"

"1" = "game.skill.0"
"2" = "game.skill.1"
"3" = "game.skill.2"
"4" = "game.skill.3"
"5" = "game.skill.4"

i = "game.inventory"
c = "game.character"
p = "game.social"
k = "game.skills"
g = "game.guild"
return = "game.chat"
m = "game.move"
space = "game.pickup"
tab = "game.map.toggle"
f11 = "game.camera.reset"
o = "game.events"
left_shift = "game.run"
right_shift = "game.run"
